<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-controls">
                <select id="event-select" class="custom-select">
                    <option value="333">3x3x3</option>
                    <option value="222">2x2x2</option>
                    <option value="444">4x4x4</option>
                    <option value="pyram">Pyraminx</option>
                </select>
                <button id="clear-btn" class="secondary-btn">Clear Session</button>
            </div>
            <div id="scramble">Generating...</div>
        </header>

        <main id="timer-area">
            <div id="timer">0.00</div>
            <div class="status-bar">
                <span id="storage-status">● Storage: Local</span>
            </div>
        </main>

        <aside class="stats-panel">
            <h3>Solves</h3>
            <div id="solve-list"></div>
            <div class="averages">
                <p>Ao5: <span id="ao5">N/A</span></p>
                <p>Ao12: <span id="ao12">N/A</span></p>
            </div>
        </aside>
    </div>
    <script src="./script.js"></script>
</body>
</html>
